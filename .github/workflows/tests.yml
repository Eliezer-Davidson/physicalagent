name: tests
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vendor tree (NVlabs/GR00T-WholeBodyControl @ PATCH-BASE + shipped patch)
        run: |
          set -o pipefail
          {
            BASE="$(cat third_party/groot-wbc-local/PATCH-BASE.txt)" &&
            echo "base: $BASE" &&
            GIT_LFS_SKIP_SMUDGE=1 git clone --filter=blob:none --no-checkout               https://github.com/NVlabs/GR00T-WholeBodyControl "$HOME/GR00T-WholeBodyControl" &&
            cd "$HOME/GR00T-WholeBodyControl" &&
            git sparse-checkout set gear_sonic_deploy gear_sonic/utils gear_sonic/data/robot_model/model_data/g1 &&
            git checkout --quiet "$BASE" &&
            git lfs pull --include "gear_sonic_deploy/**,gear_sonic/utils/**,gear_sonic/data/robot_model/model_data/g1/**" &&
            git apply --binary "$GITHUB_WORKSPACE/third_party/groot-wbc-local/local-sonic-mods.patch"
          } 2>&1 | tee v.txt || {
            tail -n 10 v.txt | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1; }
      - run: pip install -e ".[dev]"
      - name: pytest (offline)
        run: |
          set -o pipefail
          pytest -m "not hardware" -q 2>&1 | tee out.txt || {
            tail -n 10 out.txt | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1; }
