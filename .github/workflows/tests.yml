name: tests
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: pytest (offline)
        run: |
          set -o pipefail
          pytest -m "not hardware" -q 2>&1 | tee out.txt || {
            tail -n 10 out.txt | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1; }
