[project]
name = "physicalagent"
version = "0.1.0"
description = "One adapter interface between Gemini Robotics-ER and four robot bodies, with a typed tiered-safety layer between them"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "roslibpy>=1.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "paramiko>=3.4",
    # tonypi.dedupe_frame crops this robot's duplicated camera half before the
    # frame reaches the vision model. It passes the frame through untouched if
    # PIL will not import -- correct for one bad frame, but it means a MISSING
    # Pillow silently disables the fix. Declared so it is never missing;
    # tests/test_tonypi_dedupe.py fails loudly if it goes away anyway.
    "pillow>=10.0",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6"]
# physicalagent/robots/minihexa_link.py imports bleak for the BLE transport.
# It is optional: the serial transport and every Fake link work without it.
ble = ["bleak>=0.22"]
# simbridge/ and the MuJoCo-side scripts.
sim = ["mujoco>=3.2", "pyzmq>=25.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
physicalagent = "physicalagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physicalagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a live robot (deselect with '-m \"not hardware\"')",
]
addopts = "-m 'not hardware'"
